<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Mannan Restaurant POS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
    <div class="login-card">
        <h2>Reset Password</h2>
        <p class="subtitle">Choose a new password (at least 8 characters).</p>
        <form id="resetForm">
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="password" required minlength="8">
            </div>
            <div class="form-group">
                <label>Confirm New Password</label>
                <input type="password" id="confirm" required minlength="8">
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="saveBtn">Update Password</button>
            <p id="msg"></p>
        </form>
        <p class="link-text"><a href="index.html">Back to sign in</a></p>
    </div>
    <script>
        const token = new URLSearchParams(window.location.search).get('token') || '';
        const msg = document.getElementById('msg');
        function show(text, ok) { msg.textContent = text; msg.className = ok ? 'success-text' : 'error-text'; }
        if (!token) show('This reset link is invalid or has expired.', false);

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            if (password !== document.getElementById('confirm').value) return show('Passwords do not match.', false);
            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            try {
                const res = await fetch('api/reset_password.php', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                });
                const data = await res.json();
                show(data.message, data.success);
                if (data.success) setTimeout(() => { window.location.href = 'index.html'; }, 2000);
            } catch (err) {
                show('Server error. Make sure Apache and MySQL are running.', false);
            }
            btn.disabled = false;
        });
    </script>
</body>
</html>
