<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Mannan Restaurant POS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
    <div class="login-card">
        <h2>Forgot Password</h2>
        <p class="subtitle">Enter your staff email to receive a reset link.</p>
        <form id="forgotForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="Enter your staff email" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="sendBtn">Send Reset Link</button>
            <p id="msg"></p>
        </form>
        <p class="link-text"><a href="index.html">Back to sign in</a></p>
    </div>
    <script>
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('msg'), btn = document.getElementById('sendBtn');
            btn.disabled = true; msg.textContent = 'Sending...'; msg.className = '';
            try {
                const res = await fetch('api/forgot_password.php', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: document.getElementById('email').value })
                });
                const data = await res.json();
                msg.textContent = data.message;
                msg.className = data.success ? 'success-text' : 'error-text';
            } catch (err) {
                msg.textContent = 'Server error. Make sure Apache and MySQL are running.';
                msg.className = 'error-text';
            }
            btn.disabled = false;
        });
    </script>
</body>
</html>
