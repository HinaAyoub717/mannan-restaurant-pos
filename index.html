<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mannan Restaurant POS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
    <div class="login-card">
        <h2>Mannan Restaurant</h2>
        <p class="subtitle">Management & POS System (Hyderabad)</p>

        <form id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="Enter your staff email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Sign In</button>
            <p id="loginError" class="error-text"></p>
        </form>
        <p class="link-text"><a href="forgot_password.html">Forgot password?</a></p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('loginError');
            errorEl.textContent = '';

            try {
                const res = await fetch('api/login.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (data.success) {
                    localStorage.setItem('mannan_user', JSON.stringify(data.user));
                    window.location.href = 'app.html';
                } else {
                    errorEl.textContent = data.message || 'Invalid credentials';
                }
            } catch (err) {
                errorEl.textContent = 'Server error. Make sure XAMPP Apache & MySQL are running.';
            }
        });
    </script>
</body>
</html>
